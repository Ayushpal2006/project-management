<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Skilled Brains Strategy Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: infinite dotted canvas (FigJam-style) with a two-sided mind map — pillars right, systems left — floating toolbars and a slide-in detail panel. */
:root{
  --bg:#F3F4F9; --dot:#C9CEDD; --surface:#FFFFFF; --surface-2:#F8F9FC; --ink:#15172E; --on-ink:#FFFFFF; --muted:#5A6079; --line:#E1E4EE;
  --shadow:0 1px 2px rgba(21,23,46,.06),0 10px 28px -14px rgba(21,23,46,.22);
  --shadow-lg:0 2px 6px rgba(21,23,46,.08),0 24px 48px -20px rgba(21,23,46,.30);
  --blue:#2D5BFF; --blue-soft:#E7EDFF; --blue-ink:#1D3FC4; --on-blue:#FFFFFF;
  --coral:#F0532D; --coral-soft:#FFEAE3; --coral-ink:#B5320F; --on-coral:#FFFFFF;
  --violet:#7A3DF0; --violet-soft:#F0E8FF; --violet-ink:#5A22C9; --on-violet:#FFFFFF;
  --yellow:#FFC23D; --yellow-soft:#FFF4D6; --yellow-ink:#7A5200; --on-yellow:#2A2000;
  --pink:#EC3E8A; --pink-soft:#FFE6F1; --pink-ink:#B3125A; --on-pink:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --dot:#272B45; --surface:#181B30; --surface-2:#1E2239; --ink:#EEF0FA; --on-ink:#12142A; --muted:#A4A9C4; --line:#2C3050;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 48px -20px rgba(0,0,0,.8);
  --blue:#6E8DFF; --blue-soft:#1C2550; --blue-ink:#AFC1FF; --on-blue:#0B1233;
  --coral:#FF7B57; --coral-soft:#3A1D16; --coral-ink:#FFB49E; --on-coral:#2A0D05;
  --violet:#A47DFF; --violet-soft:#2A1D4C; --violet-ink:#D2BEFF; --on-violet:#170A33;
  --yellow:#FFD15C; --yellow-soft:#352A0E; --yellow-ink:#FFE19A; --on-yellow:#2A2000;
  --pink:#FF6FA8; --pink-soft:#3A1527; --pink-ink:#FFB0CF; --on-pink:#2E0516;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1020; --dot:#272B45; --surface:#181B30; --surface-2:#1E2239; --ink:#EEF0FA; --on-ink:#12142A; --muted:#A4A9C4; --line:#2C3050;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 48px -20px rgba(0,0,0,.8);
  --blue:#6E8DFF; --blue-soft:#1C2550; --blue-ink:#AFC1FF; --on-blue:#0B1233;
  --coral:#FF7B57; --coral-soft:#3A1D16; --coral-ink:#FFB49E; --on-coral:#2A0D05;
  --violet:#A47DFF; --violet-soft:#2A1D4C; --violet-ink:#D2BEFF; --on-violet:#170A33;
  --yellow:#FFD15C; --yellow-soft:#352A0E; --yellow-ink:#FFE19A; --on-yellow:#2A2000;
  --pink:#FF6FA8; --pink-soft:#3A1527; --pink-ink:#FFB0CF; --on-pink:#2E0516;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.app{position:fixed;inset:0;}

/* canvas */
#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.4px);background-size:24px 24px}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-linecap:round}

/* top bar */
.topbar{position:absolute;z-index:20;top:12px;left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 10px;box-shadow:var(--shadow)}
.mark{display:grid;grid-template-columns:repeat(3,8px);gap:3px}
.mark i{width:8px;height:8px;border-radius:50%;display:block}
.brand b{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;box-sizing:border-box;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:0 14px 0 40px;font:inherit;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--muted)}
.search>svg{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.results{position:absolute;top:50px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);
  padding:6px;max-height:min(420px,60vh);overflow:auto;margin:0;list-style:none}
.results li{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.results li[aria-selected="true"],.results li:hover{background:var(--surface-2)}
.results .dot{width:10px;height:10px;border-radius:50%;background:var(--a);flex:none;margin-top:5px}
.results .t{font-weight:600;font-size:14px}
.results .p{font-size:12px;color:var(--muted);margin-top:1px}
.results .none{color:var(--muted);cursor:default;font-size:14px}
.tools{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;border-radius:10px;height:34px;padding:0 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.seg button .sw{width:8px;height:8px;border-radius:50%;background:var(--a)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px 0 8px;display:flex;align-items:center;gap:5px}
.seg .lbl svg{width:14px;height:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;padding:0 13px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.btn:hover,.seg button:hover:not([aria-pressed="true"]){color:var(--ink);background:var(--surface-2)}
.btn svg{width:17px;height:17px}

/* zoom + legend */
.zoom{position:absolute;z-index:20;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;align-items:center;gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.zoom button{width:38px;height:38px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.zoom button:hover{background:var(--surface-2)}
.zoom svg{width:18px;height:18px}
.zoom output{font-family:var(--f-mono);font-size:12px;min-width:46px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{position:absolute;z-index:20;left:max(16px,calc(env(safe-area-inset-left,0px) + 12px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;gap:14px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);max-width:calc(100% - 230px)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:16px;height:12px;border-radius:4px;border:1.5px solid var(--muted);display:inline-block}
.lg.pill{background:var(--ink);border-color:var(--ink)}
.lg.own{border-radius:50%;width:12px}
.lg.idea{border-style:solid;border-color:var(--line);background:var(--surface-2)}
.lg.course{border-style:dashed}
.lg.sys{border-radius:3px;background:var(--surface-2)}
.hint{position:absolute;z-index:19;left:50%;transform:translateX(-50%);bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 84px));background:var(--ink);color:var(--on-ink);
  font-size:13px;padding:9px 14px;border-radius:999px;box-shadow:var(--shadow-lg);transition:opacity .4s;white-space:nowrap}
.hint.gone{opacity:0;pointer-events:none}
.focusbar{position:absolute;z-index:19;left:50%;transform:translateX(-50%);top:76px;background:var(--a);color:var(--a-on);border-radius:999px;padding:6px 6px 6px 14px;
  display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg)}
.focusbar button{border:0;background:rgba(255,255,255,.22);color:inherit;border-radius:999px;height:28px;padding:0 10px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:4px}
.focusbar svg{width:14px;height:14px}

/* nodes */
.node{position:absolute;left:0;top:0;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  cursor:pointer;user-select:none;-webkit-user-select:none;will-change:transform,opacity;transition:box-shadow .2s,border-color .2s}
.node:hover{border-color:var(--a);box-shadow:var(--shadow-lg)}
.node.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--a),var(--shadow-lg)}
.node.hit{animation:hit 1.8s ease-out}
@keyframes hit{0%,40%{box-shadow:0 0 0 3px var(--surface),0 0 0 8px var(--a),var(--shadow-lg)}100%{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--a),var(--shadow-lg)}}
.node.exiting{pointer-events:none}
.eyebrow svg{width:13px;height:13px;vertical-align:-2px}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--a-ink)}
.chev{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--a-soft);color:var(--a-ink);flex:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.chev svg{width:16px;height:16px}
.open>.chev, .open .chev{transform:rotate(90deg)}
.L .chev{transform:scaleX(-1)} .L.open .chev{transform:scaleX(-1) rotate(90deg)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}

.n-root{width:330px;padding:22px 22px 18px;background:var(--ink);color:var(--on-ink);border:0;border-radius:24px}
.n-root .eyebrow{color:inherit;opacity:.7}
.n-root h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.025em;margin:8px 0 4px;text-wrap:balance}
.n-root .sub{font-size:15px;opacity:.8}
.goal{display:flex;align-items:baseline;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--on-ink) 18%,transparent)}
.goal b{font-family:var(--f-display);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.goal span{font-size:14px;opacity:.8;line-height:1.3}
.aud{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.aud span{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--on-ink) 12%,transparent)}
.rootfoot{display:flex;gap:6px;margin-top:16px}
.rootfoot i{height:5px;flex:1;border-radius:3px;display:block}

.n-pillar,.n-system{width:280px;padding:16px}
.tile{width:46px;height:46px;border-radius:14px;background:var(--a);color:var(--a-on);display:grid;place-items:center;flex:none}
.tile svg{width:24px;height:24px}
.n-system .tile{border-radius:50%}
.n-pillar h2,.n-system h2{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:-.02em;margin:2px 0 0;line-height:1.05}
.n-pillar .meta,.n-system .meta{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.4}
.n-pillar .foot,.n-system .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.n-pillar{border-top:5px solid var(--a)}
.n-system{background:var(--surface-2);border-style:dashed;border-color:color-mix(in srgb,var(--a) 55%,var(--line))}

.n-group{padding:10px 12px 10px 10px;background:var(--a-soft);border-color:transparent;border-radius:14px;min-width:200px}
.n-group .ic{width:32px;height:32px;border-radius:10px;background:var(--surface);color:var(--a-ink);display:grid;place-items:center;flex:none}
.n-group .ic svg{width:17px;height:17px}
.n-group .lbl{font-weight:700;font-size:15.5px;color:var(--ink);flex:1}
.badge{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--surface);color:var(--a-ink);border-radius:999px;padding:2px 8px}

.n-owner{width:300px;padding:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--a);color:var(--a-on);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;flex:none;
  box-shadow:0 0 0 3px var(--a-soft)}
.n-owner .nm{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.n-owner .rl{font-size:13px;color:var(--muted);margin-top:2px}
.items{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;gap:7px}
.items li{display:flex;gap:8px;font-size:14px;line-height:1.35}
.items li svg{width:15px;height:15px;color:var(--a);flex:none;margin-top:2px}
.items li.hl{background:var(--a-soft);border-radius:6px;margin:-2px -6px;padding:2px 6px}
.more{font-size:12.5px;color:var(--muted);margin-top:8px}

.n-idea{width:260px;padding:12px 14px}
.n-idea .t{font-weight:700;font-size:15px;line-height:1.3;margin:4px 0 8px;text-wrap:balance}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--a-soft);color:var(--a-ink)}
.tag svg{width:12px;height:12px}

.n-course{width:290px;padding:14px;border:1.5px dashed var(--a);background:var(--surface)}
.n-course .lbl{font-family:var(--f-display);font-weight:700;font-size:17px;flex:1}
.ticket{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.ticket li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:8px 10px;border-radius:10px;background:var(--a-soft);color:var(--ink)}
.ticket li svg{width:15px;height:15px;color:var(--a-ink);flex:none}
.ticket li.hl{outline:2px solid var(--a)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.4}

.n-list{width:330px;padding:14px}
.n-list .lbl{font-family:var(--f-display);font-weight:700;font-size:17px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.chips span.hl{background:var(--a-soft);border-color:var(--a)}

.n-special{padding:16px;width:340px}
.n-cycle{width:320px}.n-process{width:300px}
.n-special .lbl{font-family:var(--f-display);font-weight:700;font-size:17px}
.formula{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.formula div{border-radius:12px;padding:10px;background:var(--a-soft);position:relative}
.formula b{font-family:var(--f-mono);font-size:11px;color:var(--a-ink);display:block}
.formula span{font-family:var(--f-display);font-weight:700;font-size:17px}
.formula small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.formula div:first-child{background:var(--a);color:var(--a-on)}
.formula div:first-child b,.formula div:first-child small{color:inherit;opacity:.85}

.cycle{display:block;margin:6px auto 0;width:100%;height:auto}
.cycle text{font-family:var(--f-body);font-weight:700;font-size:12.5px;fill:var(--ink)}
.cycle .c-ring{fill:none;stroke:var(--line);stroke-width:2}
.cycle .c-flow{fill:none;stroke:var(--a);stroke-width:2.5;stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.cycle .c-node{animation:beat 6s infinite}
.cycle .c-node circle.halo{opacity:0;animation:halo 6s infinite}
.cycle .k2,.cycle .k2 circle.halo{animation-delay:2s}.cycle .k3,.cycle .k3 circle.halo{animation-delay:4s}
@keyframes halo{0%,28%{opacity:.35}34%,100%{opacity:0}}
.cycle .center{font-family:var(--f-mono);font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:.06em}

.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding-bottom:10px;position:relative}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;
  background:var(--surface-2);border:1.5px solid var(--line);color:var(--muted);box-sizing:border-box;z-index:1}
.steps li::after{content:"";position:absolute;left:12.5px;top:26px;bottom:0;width:1.5px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li span{font-weight:600;font-size:14.5px;padding-top:3px}
.steps li.key::before{background:var(--a);border-color:var(--a);color:var(--a-on)}
.steps li.key small{display:block;font-size:12.5px;color:var(--a-ink);font-weight:600;margin-top:2px}

/* side panel */
.panel{position:absolute;z-index:30;top:76px;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:76px;width:380px;max-width:calc(100% - 32px);background:var(--surface);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.panel.on{transform:none;visibility:visible}
.panel header{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:relative}
.panel header::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--a)}
.panel h3{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:6px 40px 0 0;line-height:1.05;text-wrap:balance}
.panel .psub{color:var(--muted);font-size:14px;margin-top:4px}
.panel .close{position:absolute;right:12px;top:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.panel .close svg{width:18px;height:18px}
.pbody{padding:16px 18px 22px;overflow:auto;display:grid;gap:18px;align-content:start}
.pbody p{margin:0;line-height:1.55;font-size:15px;max-width:62ch}
.pbody h4{margin:0 0 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{font-size:14.5px;line-height:1.4;display:flex;gap:8px}
.plist li svg{width:15px;height:15px;color:var(--a);flex:none;margin-top:3px}
.plink{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;width:100%;font-size:14px;font-weight:600}
.plink:hover{border-color:var(--a)}
.plink .dot{width:9px;height:9px;border-radius:50%;background:var(--a);flex:none}
.plink svg{width:15px;height:15px;margin-left:auto;color:var(--muted)}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.pact .btn{box-shadow:none;height:40px}
.pact .btn.primary{background:var(--a);color:var(--a-on);border-color:var(--a)}
.callout{background:var(--a-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--ink)}

@media (max-width:860px){
  .brand small{display:none}
  .tools{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .seg .lbl{display:none}
  .btn span{display:none}
  .search{flex-basis:200px}
  .legend{display:none}
  .panel{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-width:none;bottom:max(12px,env(safe-area-inset-bottom,0px));height:58vh;transform:translateY(calc(100% + 40px))}
  .focusbar{top:auto;bottom:80px}
  .hint{white-space:normal;width:max-content;max-width:80vw;text-align:center}
}
@media (min-width:1800px){ body{font-size:16px} }
@media (prefers-reduced-motion: reduce){
  .cycle .c-flow,.cycle .c-node,.cycle .c-node circle.halo,.node.hit{animation:none}
  .panel,.chev{transition:none}
}

<div class="app">

  <div id="focusbar" class="focusbar" hidden></div>

  <div class="legend" aria-label="Legend">

  <div class="zoom" role="group" aria-label="Zoom controls">

      <button class="close" id="pClose" aria-label="Close details"><i data-lucide="x"></i></button></header>
    <div class="pbody" id="pBody"></div>

</div>

/* index */
const N = new Map(), PARENT = new Map();
(function walk(n, p){ N.set(n.id, n); if (p){ PARENT.set(n.id, p.id); if(!n.acc) n.acc = p.acc; if(!n.side) n.side = p.side; }
  (n.children||[]).forEach(c => walk(c, n)); })(TREE, null);
const hasKids = n => !!(n.children && n.children.length);
const toggleable = n => hasKids(n) || ((n.type==="owner"||n.type==="list"||n.type==="course") && n.items && n.items.length);
const accVars = a => a==="ink" ? "--a:var(--ink);--a-soft:var(--surface-2);--a-ink:var(--ink);--a-on:var(--on-ink)"
  : `--a:var(--${a});--a-soft:var(--${a}-soft);--a-ink:var(--${a}-ink);--a-on:var(--on-${a})`;
const pillarOf = id => { let x=id; while(PARENT.get(x) && PARENT.get(x)!=="root") x=PARENT.get(x); return x==="root"?null:x; };
const pathOf = id => { const out=[]; let x=PARENT.get(id); while(x && x!=="root"){ out.unshift(N.get(x).label); x=PARENT.get(x);} return out.join(" › "); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICONS = {
check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', minus:'<path d="M5 12h14"/>',

"arrow-up-right":'<path d="M7 7h10v10"/><path d="M7 17 17 7"/>', search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

clapperboard:'<path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',

let expanded = new Set(["root"]), focus = null, selected = null, hlItem = null;
try { const s = JSON.parse(localStorage.getItem(KEY)||"null");

/* ───────────── NODE TEMPLATES ───────────── */

  const chev = toggleable(n) ? `<span class="chev" aria-hidden="true">${I("chevron-right")}</span>` : "";

    case "root": return `<div class="eyebrow">Organic content strategy</div><h1>${esc(n.label)}</h1><div class="sub">${esc(n.sub)}</div>

      <div class="aud"><span>College students</span><span>Working professionals</span><span>Aspiring creators</span></div>
      <div class="rootfoot" aria-hidden="true"><i style="background:var(--violet)"></i><i style="background:var(--coral)"></i><i style="background:var(--blue)"></i></div>`;
    case "pillar": case "system": {
      const k = n.children.length;
      return `<div class="row"><div class="tile">${I(n.icon)}</div><div style="flex:1;min-width:0"><div class="eyebrow">${n.type==="pillar"?`Pillar ${n.num} of 3`:"System"}</div><h2>${esc(n.label)}</h2></div></div>

    case "group": return `<div class="row"><span class="ic">${I(n.icon)}</span><span class="lbl">${esc(n.label)}</span><span class="badge">${n.children.length}</span>${chev}</div>`;

    h += `<div><h4>Steps</h4>${bullets(n.steps)}</div><div class="callout"><b>Slide 1 is make-or-break.</b> It is the strongest visual on the carousel because it decides whether people swipe.</div>`;
  } else if (n.type==="system"){
    h += `<div><h4>Inside</h4><div class="plist">${n.children.map(c=>link(c.id)).join("")}</div></div>`;
  }
  document.getElementById("pBody").innerHTML = h; icons();
  const wasOn = panel.classList.contains("on"); panel.classList.add("on");
  if (!wasOn) setTimeout(()=>{},0);
}
function closePanel(re=true){ panel.classList.remove("on"); selected=null; if (re) render(); }
document.getElementById("pClose").onclick = () => closePanel();
panel.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if (g) return reveal(g.dataset.goto);
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act==="focus") setFocus(a.dataset.id); else setFocus(null);
});
addEventListener("keydown", e => { if (e.key==="Escape" && document.activeElement!==qEl) closePanel(); });

/* ───────────── SEARCH ───────────── */
const qEl = document.getElementById("q"), resEl = document.getElementById("results");
const INDEX = [];
N.forEach((n,id) => {
  INDEX.push({id, text:n.label, extra:[n.desc,n.role,n.fmt,n.owners].filter(Boolean).join(" "), kind:TYPE_NAME[n.type]});
  (n.items||[]).forEach(it => INDEX.push({id, item:it, text:it, extra:"", kind:n.label}));
  (n.steps||[]).forEach(it => INDEX.push({id, text:it, extra:"", kind:"Carousel step", step:true}));
});
let hits=[], act=0;
function doSearch(){
  const q = qEl.value.trim().toLowerCase();
  if (!q){ resEl.hidden=true; qEl.parentElement.setAttribute("aria-expanded","false"); return; }
  const score = r => { const t=r.text.toLowerCase(); if (t.startsWith(q)) return 3; if (t.includes(q)) return 2; if (r.extra.toLowerCase().includes(q)) return 1; return 0; };
  hits = INDEX.map(r=>({r,s:score(r)})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,9).map(x=>x.r); act=0;
  resEl.innerHTML = hits.length ? hits.map((r,i)=>{ const n=N.get(r.id); const where = r.item ? `${r.kind} · ${pathOf(r.id)||n.label}` : `${r.kind}${pathOf(r.id)?" · "+pathOf(r.id):""}`;
    return `<li role="option" id="opt${i}" data-i="${i}" aria-selected="${i===0}" style="${accVars(n.acc)}"><span class="dot"></span><div><div class="t">${esc(r.text)}</div><div class="p">${esc(where)}</div></div></li>`; }).join("")
    : `<li class="none" role="option" aria-disabled="true">No matches. Try a name, idea or format.</li>`;
  resEl.hidden=false; qEl.parentElement.setAttribute("aria-expanded","true");
}
function pick(i){ const r=hits[i]; if(!r) return; resEl.hidden=true; qEl.blur(); hideHint(); reveal(r.id, r.item||null); }
qEl.addEventListener("input", doSearch);
qEl.addEventListener("keydown", e => {
  if (e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!hits.length) return; act=(act+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length;
    resEl.querySelectorAll("li").forEach((li,i)=>li.setAttribute("aria-selected", String(i===act))); qEl.setAttribute("aria-activedescendant","opt"+act); }
  else if (e.key==="Enter"){ e.preventDefault(); pick(act); }
  else if (e.key==="Escape"){ qEl.value=""; doSearch(); }
});
resEl.addEventListener("mousedown", e => { const li=e.target.closest("li[data-i]"); if (li){ e.preventDefault(); pick(+li.dataset.i); } });
qEl.addEventListener("blur", () => setTimeout(()=>resEl.hidden=true, 120));
qEl.addEventListener("focus", () => { if (qEl.value) doSearch(); });

/* ───────────── BOOT ───────────── */
function icons(){ document.querySelectorAll("i[data-lucide]").forEach(el => { el.outerHTML = I(el.dataset.lucide); }); }
const hint = document.getElementById("hint"); function hideHint(){ hint.classList.add("gone"); }
setTimeout(hideHint, 9000);
applyView();
const boot = () => { render({instant:true}); view = fitView(); applyView(); if (focus) syncChrome(); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt=setTimeout(()=>viewTo(fitView()), 150); });
window.__tsb = { N, S, expanded:()=>expanded, view:()=>view, visible:()=>lastVis.map(v=>v.n.id) };
})();
