<html><head><style>@font-face{font-family:Satoshi;src:url(../fonts/Satoshi-Regular.woff2);font-weight:400}
@font-face{font-family:Satoshi;src:url(../fonts/Satoshi-Bold.woff2);font-weight:700}
*{margin:0;box-sizing:border-box}body{font-family:Satoshi,sans-serif}
body{width:1080px;height:2340px;background:#111;color:#eee;padding-top:150px}
.pv{margin:0 60px;height:1080px;border-radius:30px;background:url(../plates/d08.jpg) 72% 50%/cover}
.tools{display:flex;justify-content:space-around;margin:70px 60px 0;font-size:44px;color:#bbb}
.tc{margin:70px 0 0;position:relative;padding:0 60px}
.tr{display:flex;gap:10px;height:150px;margin-bottom:26px}.tr i{border-radius:18px}
.ph{position:absolute;left:46%;top:-30px;bottom:-30px;width:8px;background:#fff;border-radius:4px}
.time{text-align:center;font-size:48px;margin-top:60px;font-weight:700}
.btn{margin:80px auto 0;width:420px;height:130px;border-radius:65px;background:#C8691C;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:#fff}
</style></head><body><div class="pv"></div><div class="time">00:07 / 00:15</div>
<div class="tools"><span>✂ Split</span><span>◐ Colour</span><span>T Text</span><span>♪ Audio</span></div>
<div class="tc"><div class="tr"><i style="flex:3;background:#2F6B4F"></i><i style="flex:2;background:#3C7D5C"></i><i style="flex:4;background:#2A5F46"></i></div>
<div class="tr" style="height:90px"><i style="flex:1.2;background:transparent"></i><i style="flex:2;background:#C8691C"></i><i style="flex:3;background:transparent"></i></div>
<div class="tr" style="height:90px"><i style="flex:9;background:#3B4A7A"></i></div><div class="ph"></div></div>
<div class="btn">Export</div></body></html>
